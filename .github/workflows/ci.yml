name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-windows:
    name: Testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Rodar suíte rápida (default)
        run: python -m pytest -q

      - name: Rodar suíte de integração
        run: python -m pytest -m integration -q
        continue-on-error: true

  lint:
    name: Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências de lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.5 mypy==1.18.2

      - name: Ruff
        run: ruff check app tests
        continue-on-error: true

      - name: Mypy (não bloqueante por enquanto)
        run: mypy app
        continue-on-error: true
